<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a"><meta name="robots" content="noindex"><title>Launch</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Launch</h1>
<p class="muted">This sends the already-signed contract to Polygon. It only works once, from the launch wallet.</p>
<div class="paper">
<p><b>Launch wallet</b><br><code id="from" style="word-break:break-all"></code></p>
<p><b>Balance</b><br><span id="bal">·</span></p>
<p><b>Contract will live at</b><br><code id="addr" style="word-break:break-all"></code></p>
<p id="state">Checking…</p>
<button id="go" class="primary" type="button" disabled>Launch</button>
<pre id="log" class="small" style="white-space:pre-wrap;word-break:break-all"></pre>
<p id="links" hidden><a href="./">Open the wall</a></p>
</div>
</main><script src="launch.js"></script></body></html>
